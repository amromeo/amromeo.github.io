name: Task H interrupted pilot recovery
on:
  push:
    branches: [study/subsample]
    paths: [anchoredRI/tools/subsample/launch-pilot.json]

permissions:
  contents: read
  actions: read
env:
  STUDY: anchoredRI/tools/subsample
  ORIGINAL_RUN: "45854822638"

jobs:
  preflight:
    name: recovery-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TASK_H_ROLE: recovery
      TASK_H_KEY: preflight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            anchoredRI/tools/subsample
            anchoredRI/R
            anchoredRI/inst
            anchoredRI/man
            anchoredRI/src
      - name: Verify recovery source and launch receipt
        run: python3 "$STUDY/freeze.py" verify
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45854822638
          pattern: 'pilot-{2734,3279,4384,4968,5017,5510}'
          path: failed-pilots
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45854822638
          name: runtime
      - name: Check original pilot records and runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p output/account
          TIMEFORMAT=$'%R\t%U\t%S'
          { time {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN/attempts/1/jobs?per_page=100" > original-jobs.json
            python3 - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          interrupted = {2734, 3279, 4384, 4968, 5017, 5510}
          with (Path(os.environ["STUDY"]) / "pilot-roster.csv").open() as source:
              roster = {int(r["Index"]) for r in csv.DictReader(source)}
          data = json.loads(Path("original-jobs.json").read_text())
          gates = {j["name"]: j["conclusion"] for j in data["jobs"]}
          if any(gates.get(gate) != "success" for gate in ("fixtures-primary", "fixtures-other", "fixturecheck-single", "archivecheck-single")):
              raise SystemExit("The original fixture and archive audits must have passed")
          jobs = {int(j["name"].split("-")[1]): j for j in data["jobs"] if j["name"].startswith("pilot-")}
          failed = {i for i, j in jobs.items() if j["status"] == "completed" and j["conclusion"] != "success"}
          if set(jobs) != roster or failed != interrupted or any(jobs[i]["conclusion"] != "failure" for i in interrupted):
              raise SystemExit(f"Original roster or interruption list differs: {sorted(failed)}")
          folders = {p.name for p in Path("failed-pilots").iterdir()}
          if folders != {f"pilot-{i}" for i in interrupted}:
              raise SystemExit("Missing or unexpected failed-pilot artifact")
          for i in sorted(interrupted):
              records = Path(f"failed-pilots/pilot-{i}/records")
              files = {p.relative_to(records).as_posix() for p in records.rglob("*") if p.is_file()}
              if files != {f"{i}/input-id.rds"}:
                  raise SystemExit(f"Index {i} has a fit or draw checkpoint, or lacks its input receipt")
              print(f"Index {i}: original job {jobs[i]['id']} failed before any saved fit or draw")
          PY
            cmp "$STUDY/results/pilot-45854822638/runtime/runtime.sha256" runtime.sha256
            sha256sum -c runtime.sha256
            tar xzf runtime.tgz
          } 2>&3; } 3>&2 2>preflight-time
          printf 'verify-and-restore\t%s\n' "$(cat preflight-time)" >> output/account/recovery-preflight.tsv
          bash "$STUDY/hosted.sh" report-R "$STUDY/timer-check.R" output/timer-check.csv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recovery-preflight
          path: output/
          if-no-files-found: error
          compression-level: 1

  pilot:
    name: pilot-${{ matrix.index }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        index: [2734, 3279, 4384, 4968, 5017, 5510]
    env:
      TASK_H_KEY: ${{ matrix.index }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            anchoredRI/tools/subsample
            anchoredRI/R
            anchoredRI/inst
            anchoredRI/man
            anchoredRI/src
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45854822638
          name: runtime
      - run: |
          cmp "$STUDY/results/pilot-45854822638/runtime/runtime.sha256" runtime.sha256
          bash "$STUDY/hosted.sh" pilot "$TASK_H_KEY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pilot-${{ matrix.index }}
          path: output/
          if-no-files-found: error
          compression-level: 1

  report:
    name: report-single
    needs: pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            anchoredRI/tools/subsample
            anchoredRI/R
            anchoredRI/inst
            anchoredRI/man
            anchoredRI/src
      - name: Wait for the other original pilots to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while [[ $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN" --jq .status) != completed ]]; do sleep 30; done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45854626824
          name: receipt-build
          path: first-aborted/receipt-build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 45854822638
          path: incoming
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: recovered
      - name: Assemble the 20 completed records and both pilot attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          get_jobs() { gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1/attempts/$2/jobs?per_page=100" > "$3"; }
          get_jobs 45854626824 1 jobs-aborted.json
          get_jobs "$ORIGINAL_RUN" 1 jobs-original.json
          get_jobs "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" jobs-recovery.json
          cp incoming/runtime/runtime.* .
          cmp "$STUDY/results/pilot-45854822638/runtime/runtime.sha256" runtime.sha256
          python3 - <<'PY'
          import csv
          import json
          import os
          import shutil
          from pathlib import Path

          # Keep all receipts in their original per-run directories for accounting.
          interrupted = {2734, 3279, 4384, 4968, 5017, 5510}
          with (Path(os.environ["STUDY"]) / "pilot-roster.csv").open() as source:
              roster = {int(r["Index"]) for r in csv.DictReader(source)}
          def jobs(path):
              data = json.loads(Path(path).read_text())
              if len(data["jobs"]) != data["total_count"]:
                  raise ValueError(f"Incomplete GitHub job list: {path}")
              return {int(j["name"].split("-")[1]): j["conclusion"] for j in data["jobs"]
                      if j["name"].startswith("pilot-")}
          old, new = jobs("jobs-original.json"), jobs("jobs-recovery.json")
          if set(old) != roster or {i for i, state in old.items() if state != "success"} != interrupted:
              raise SystemExit("Unexpected additional original failure; inspect its checkpoints before retrying")
          if set(new) != interrupted or set(new.values()) != {"success"}:
              raise SystemExit("Incomplete recovery")
          merged = Path("all-records")
          merged.mkdir()
          for i in sorted(roster):
              run_dir = "recovered" if i in interrupted else "incoming"
              path = Path(f"{run_dir}/pilot-{i}/records/{i}")
              if not (path / "COMPLETE").is_file():
                  raise SystemExit(f"No complete pilot for {i} in {run_dir}")
              shutil.copytree(path, merged / str(i), copy_function=os.link)
          PY
          TASK_H_RECOVERY=1 bash "$STUDY/hosted.sh" report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pilot-report
          path: output/
          if-no-files-found: error
          compression-level: 1
